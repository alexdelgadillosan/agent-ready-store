services:
  - type: web
    name: agent-ready-store
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: agent-ready-store-db
          property: connectionString
      - key: APP_URL
        sync: false
      - key: SHOPIFY_SHOP
        sync: false
      - key: SHOPIFY_CLIENT_ID
        sync: false
      - key: SHOPIFY_CLIENT_SECRET
        sync: false
      - key: SHOPIFY_API_VERSION
        value: "2026-10"
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_ENV
        value: sandbox
      - key: CHECKOUT_TTL_MINUTES
        value: "30"
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: LLM_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        value: openai/gpt-oss-120b
      - key: MCP_BEARER_TOKEN
        sync: false
      - key: CHANNEL3_API_KEY
        sync: false

databases:
  - name: agent-ready-store-db
    plan: free
    databaseName: agent_ready_store
    user: agent_ready_store
