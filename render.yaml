services:
  - type: web
    name: omnibuy-ai
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: omnibuy-ai-db
          property: connectionString
      - key: APP_URL
        sync: false
      - key: SHOPIFY_SHOP
        sync: false
      - key: SHOPIFY_CLIENT_ID
        sync: false
      - key: SHOPIFY_CLIENT_SECRET
        sync: false
      - key: SHOPIFY_API_VERSION
        value: "2026-10"
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_ENV
        value: sandbox
      - key: CHECKOUT_TTL_MINUTES
        value: "30"
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: LLM_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        value: openai/gpt-oss-120b
      - key: MCP_BEARER_TOKEN
        sync: false
      - key: FX_PROVIDER_URL
        value: https://api.frankfurter.app
      - key: FX_CACHE_TTL_SECONDS
        value: "900"
      - key: FX_BASE_CURRENCY
         value: USD

databases:
  - name: omnibuy-ai-db
    plan: free
    databaseName: omnibuy_ai
    user: omnibuy_ai
